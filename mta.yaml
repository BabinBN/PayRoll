_schema-version: 3.3.0
ID: PayRoll
description: A simple CAP project.
version: 1.0.0-SNAPSHOT
modules:
- name: PayRoll-srv
  type: java
  path: srv
  properties:
    JBP_CONFIG_COMPONENTS: 'jres: [''com.sap.xs.java.buildpack.jre.SAPMachineJRE'']'
    JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 21.+ }'
    SPRING_PROFILES_ACTIVE: cloud,sandbox
  requires:
  - name: PayRoll-db
  - name: uaa_PayRoll
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: sap_java_buildpack_jakarta
    instances: 1
  build-parameters:
    build-result: target/*-exec.jar
    builder: custom
    commands:
    - mvn clean package -DskipTests=true --batch-mode
- name: PayRoll-db-deployer
  type: hdb
  path: db
  requires:
  - name: PayRoll-db
  parameters:
    buildpack: nodejs_buildpack
  build-parameters:
    builder: custom
    commands:
    - npm run build
- name: PayRoll-destination-content
  type: com.sap.application.content
  requires:
  - name: PayRoll-destination-service
    parameters:
      content-target: true
  - name: PayRoll_html_repo_host
    parameters:
      service-key:
        name: PayRoll_html_repo_host-key
  - name: uaa_PayRoll
    parameters:
      service-key:
        name: uaa_PayRoll-key
  parameters:
    content:
      instance:
        destinations:
        - Name: payroll_BN_PayRoll_html_repo_host
          ServiceInstanceName: PayRoll-html5-app-host-service
          ServiceKeyName: PayRoll_html_repo_host-key
          sap.cloud.service: payroll_BN
        - Authentication: OAuth2UserTokenExchange
          Name: payroll_BN_uaa_PayRoll
          ServiceInstanceName: PayRoll-xsuaa-service
          ServiceKeyName: uaa_PayRoll-key
          sap.cloud.service: payroll_BN
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: PayRoll-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: PayRoll_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - employee.zip
      name: employee
      target-path: resources/
    - artifacts:
      - employeeleaves.zip
      name: employeeleaves
      target-path: resources/
- name: employee
  type: html5
  path: app/employee
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: employeeleaves
  type: html5
  path: app/employee_leaves
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: PayRoll-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: PayRoll-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: PayRoll-destination-service
    service-plan: lite
  requires:
  - name: srv-api
- name: PayRoll_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: PayRoll-html5-app-host-service
    service-plan: app-host
- name: uaa_PayRoll
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: PayRoll-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
